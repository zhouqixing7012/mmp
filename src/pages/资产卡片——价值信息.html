<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产卡片信息</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 flex justify-center h-screen items-start">

    <!-- 主卡片容器，移除 overflow-hidden 防止气泡被截断 -->
    <div class="w-full max-w-6xl bg-white border border-gray-300 shadow-sm relative flex flex-col min-h-[600px]">
        
        <!-- 头部标题栏 -->
        <!-- 模拟图片中带有轻微渐变光泽的蓝色头部 -->
        <div class="bg-gradient-to-b from-[#4db5e6] to-[#248fc4] text-white px-5 py-2.5 font-bold text-[15px] tracking-wide relative z-10 border-b border-[#248fc4]">
            资产卡片信息
        </div>

        <!-- 内容区域 -->
        <div class="relative flex-grow p-4">
            <!-- 选项卡导航 -->
            <div class="flex border border-gray-300 bg-white text-[14px] text-gray-700 relative z-10 w-full overflow-x-auto">
                <div class="px-6 py-2.5 border-r border-gray-300 cursor-pointer hover:bg-gray-50 flex-shrink-0">详细信息</div>
                <!-- 激活状态的选项卡 -->
                <div class="px-6 py-2.5 border-r border-gray-300 bg-[#498bc2] text-white font-medium cursor-pointer flex-shrink-0">价值信息</div>
                <div class="px-6 py-2.5 border-r border-gray-300 cursor-pointer hover:bg-gray-50 flex-shrink-0">资产维修记录</div>
                <div class="px-6 py-2.5 border-r border-gray-300 cursor-pointer hover:bg-gray-50 flex-shrink-0">资产盘点历史</div>
                <div class="px-6 py-2.5 border-r border-gray-300 cursor-pointer hover:bg-gray-50 flex-shrink-0">资产操作历史</div>
                <div class="px-6 py-2.5 cursor-pointer hover:bg-gray-50 flex-shrink-0">RFID资产操作历史</div>
            </div>

            <!-- 信息表格 -->
            <table class="w-full mt-4 border-collapse text-[14px] text-gray-800 border border-gray-300 relative z-10">
                <tbody>
                    <tr>
                        <!-- 浅灰色背景的表头单元格 -->
                        <td class="border border-gray-300 bg-[#f9f9f9] font-medium px-4 py-3 w-[15%]">
                            <div class="flex items-center">
                                原值
                                <!-- 将 group 专门包裹在图标上，确保定位精准 -->
                                <div class="relative group cursor-help ml-1 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-[14px] w-[14px] text-gray-400 hover:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <!-- 气泡说明改为向上弹出 -->
                                    <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block w-max max-w-[220px] bg-gray-800 text-white text-[12px] font-normal rounded py-1.5 px-2.5 z-[999] shadow-md whitespace-normal leading-snug text-left">
                                        新增入库或数据初始化时资产价值，为EBS原值
                                        <!-- 下方的向下小三角形指示器 -->
                                        <div class="absolute top-full left-1/2 transform -translate-x-1/2 border-[4px] border-transparent border-t-gray-800"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="border border-gray-300 px-4 py-3 w-[35%] bg-white/80">2,050</td>
                        <td class="border border-gray-300 bg-[#f9f9f9] font-medium px-4 py-3 w-[15%]">净值</td>
                        <td class="border border-gray-300 px-4 py-3 w-[35%] bg-white/80">0.00</td>
                    </tr>
                    <tr>
                        <td class="border border-gray-300 bg-[#f9f9f9] font-medium px-4 py-3">折旧年限</td>
                        <td class="border border-gray-300 px-4 py-3 bg-white/80">4</td>
                        <td class="border border-gray-300 bg-[#f9f9f9] font-medium px-4 py-3">折旧剩余月份</td>
                        <td class="border border-gray-300 px-4 py-3 bg-white/80">0</td>
                    </tr>
                    <tr>
                        <td class="border border-gray-300 bg-[#f9f9f9] font-medium px-4 py-3">
                            <div class="flex items-center">
                                配置参考价值
                                <!-- 将 group 专门包裹在图标上，确保定位精准 -->
                                <div class="relative group cursor-help ml-1 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-[14px] w-[14px] text-gray-400 hover:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <!-- 气泡说明改为向上弹出 -->
                                    <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block w-max max-w-[200px] bg-gray-800 text-white text-[12px] font-normal rounded py-1.5 px-2.5 z-[999] shadow-md whitespace-normal leading-snug text-left">
                                        根据资产关联备件价值计算得出
                                        <!-- 下方的向下小三角形指示器 -->
                                        <div class="absolute top-full left-1/2 transform -translate-x-1/2 border-[4px] border-transparent border-t-gray-800"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="border border-gray-300 px-4 py-3 bg-white/80" colspan="3">3,049</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
