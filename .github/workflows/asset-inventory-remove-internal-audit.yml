name: One-off asset inventory field cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asset-inventory-remove-internal-audit.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove internal audit supervisor from asset inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          TARGET = '内审监督人'
          ROOT = Path('src/pages/assetInventory')

          def brace_pairs(text):
              pairs = []
              stack = []
              i = 0
              state = 'code'
              quote = None
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'line_comment':
                      if ch == '\n': state = 'code'
                      i += 1; continue
                  if state == 'block_comment':
                      if ch == '*' and nxt == '/': state = 'code'; i += 2; continue
                      i += 1; continue
                  if state == 'string':
                      if ch == '\\': i += 2; continue
                      if ch == quote: state = 'code'; quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': state = 'line_comment'; i += 2; continue
                  if ch == '/' and nxt == '*': state = 'block_comment'; i += 2; continue
                  if ch in "'\"`": state = 'string'; quote = ch; i += 1; continue
                  if ch == '{': stack.append(i)
                  elif ch == '}' and stack:
                      pairs.append((stack.pop(), i))
                  i += 1
              return pairs

          def remove_field_objects(text):
              literals = [f"'{TARGET}'", f'"{TARGET}"']
              while True:
                  hit = None
                  for lit in literals:
                      pos = text.find(lit)
                      if pos != -1 and (hit is None or pos < hit[0]): hit = (pos, lit)
                  if hit is None: break
                  pos, lit = hit
                  candidates = [(a, b) for a, b in brace_pairs(text) if a < pos < b]
                  candidates.sort(key=lambda p: p[1] - p[0])
                  removed = False
                  for a, b in candidates:
                      snippet = text[a:b + 1]
                      prefix = snippet[:max(0, pos - a + len(lit) + 40)]
                      if not any(key in prefix for key in ('title:', 'label:', 'role:', 'name:', 'node:', 'approverType:')):
                          continue
                      start, end = a, b + 1
                      j = end
                      while j < len(text) and text[j] in ' \t': j += 1
                      if j < len(text) and text[j] == ',':
                          end = j + 1
                      else:
                          j = start - 1
                          while j >= 0 and text[j] in ' \t': j -= 1
                          if j >= 0 and text[j] == ',': start = j
                      text = text[:start] + text[end:]
                      removed = True
                      break
                  if not removed:
                      break
              return text

          def clean_js(text):
              text = remove_field_objects(text)
              lines = []
              for line in text.splitlines(True):
                  if TARGET in line and any(marker in line for marker in (
                      f'label="{TARGET}"', f"label='{TARGET}'",
                      f'title="{TARGET}"', f"title='{TARGET}'",
                  )):
                      continue
                  line = line.replace('财务监督人、内审监督人', '财务监督人')
                  line = line.replace('内审监督人、财务监督人', '财务监督人')
                  line = line.replace('、内审监督人', '')
                  line = line.replace('内审监督人、', '')
                  lines.append(line)
              text = ''.join(lines)
              text = re.sub(r'\s*,?\s*auditSupervisor\s*:\s*(?:\'[^\']*\'|"[^"]*"|[^,}\n]+)\s*,?', ',', text)
              text = text.replace('{,', '{').replace(',,', ',')
              return text

          for path in ROOT.glob('*.js'):
              original = path.read_text(encoding='utf-8')
              cleaned = clean_js(original)
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')

          prd = Path('docs/PRD-资产盘点.md')
          if prd.exists():
              lines = []
              for line in prd.read_text(encoding='utf-8').splitlines(True):
                  if TARGET not in line:
                      lines.append(line); continue
                  if line.strip().startswith('|'):
                      continue
                  line = line.replace('财务监督人、内审监督人', '财务监督人')
                  line = line.replace('内审监督人、财务监督人', '财务监督人')
                  line = line.replace('、内审监督人', '')
                  line = line.replace('内审监督人、', '')
                  line = line.replace(TARGET, '')
                  lines.append(line)
              prd.write_text(''.join(lines), encoding='utf-8')

          leftovers = []
          for path in list(ROOT.glob('*.js')) + [Path('docs/PRD-资产盘点.md')]:
              if path.exists() and TARGET in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('仍存在内审监督人引用: ' + ', '.join(leftovers))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/asset-inventory-remove-internal-audit.yml
          git add src/pages/assetInventory docs/PRD-资产盘点.md
          git diff --cached --stat
          git commit -m 'fix: remove internal audit supervisor from asset inventory'
          git push origin HEAD:main
