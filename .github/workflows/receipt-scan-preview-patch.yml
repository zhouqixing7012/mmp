name: One-off asset receipt scan preview patch

on:
  push:
    paths:
      - '.github/workflows/receipt-scan-preview-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch asset receipt scan interaction
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/inventoryManagement/AssetReceiptPage.js')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global source
              if old not in source:
                  raise RuntimeError(f'Expected source block not found:\n{old[:240]}')
              source = source.replace(old, new, 1)

          replace_once(
              "  const [maintenanceScanTargetId, setMaintenanceScanTargetId] = useState(null);\n  const [maintenanceFilterId, setMaintenanceFilterId] = useState(null);",
              "  const [maintenanceScanTargetId, setMaintenanceScanTargetId] = useState(null);\n  const [maintenanceScanPreviewId, setMaintenanceScanPreviewId] = useState(null);",
          )

          replace_once(
              "    setMaintenanceScanTargetId(null);\n    setMaintenanceFilterId(null);\n    setView('receiptMaintenance');",
              "    setMaintenanceScanTargetId(null);\n    setMaintenanceScanPreviewId(null);\n    setView('receiptMaintenance');",
          )

          replace_once(
              "    setMaintenanceScanTargetId(null);\n    setMaintenanceFilterId(null);\n    messageApi.success('生成成功！');",
              "    setMaintenanceScanTargetId(null);\n    setMaintenanceScanPreviewId(null);\n    messageApi.success('生成成功！');",
          )

          replace_once(
              "        if (maintenanceScanTargetId && selected.has(maintenanceScanTargetId)) setMaintenanceScanTargetId(null);\n        if (maintenanceFilterId && selected.has(maintenanceFilterId)) setMaintenanceFilterId(null);\n        setSelectedMaintenanceKeys([]);",
              "        if (maintenanceScanTargetId && selected.has(maintenanceScanTargetId)) setMaintenanceScanTargetId(null);\n        if (maintenanceScanPreviewId && selected.has(maintenanceScanPreviewId)) setMaintenanceScanPreviewId(null);\n        setSelectedMaintenanceKeys([]);",
          )

          replace_once(
              "  const resetMaintenanceScan = () => {\n    setMaintenanceScan('');\n    setMaintenanceScanTargetId(null);\n    setMaintenanceFilterId(null);\n    setSelectedMaintenanceKeys([]);\n  };",
              "  const resetMaintenanceScan = () => {\n    setMaintenanceScan('');\n    setMaintenanceScanTargetId(null);\n    setMaintenanceScanPreviewId(null);\n    setSelectedMaintenanceKeys([]);\n  };",
          )

          replace_once(
              "      setSelectedMaintenanceKeys([target.id]);\n      setMaintenanceScanTargetId(null);\n      setMaintenanceFilterId(null);\n      setMaintenanceScan('');",
              "      setSelectedMaintenanceKeys([target.id]);\n      setMaintenanceScanTargetId(null);\n      setMaintenanceScanPreviewId(target.id);\n      setMaintenanceScan('');",
          )

          replace_once(
              "    setMaintenanceFilterId(matched.id);\n    setMaintenanceScanTargetId(matched.id);\n    setSelectedMaintenanceKeys([matched.id]);",
              "    setMaintenanceScanTargetId(matched.id);\n    setMaintenanceScanPreviewId(matched.id);\n    setSelectedMaintenanceKeys([matched.id]);",
          )

          replace_once(
              "    const scanTargetAsset = maintenanceScanTargetId ? maintenanceRows.find((row) => row.id === maintenanceScanTargetId) || null : null;\n    const visibleMaintenanceRows = maintenanceFilterId ? maintenanceRows.filter((row) => row.id === maintenanceFilterId) : maintenanceRows;",
              "    const scanTargetAsset = maintenanceScanPreviewId ? maintenanceRows.find((row) => row.id === maintenanceScanPreviewId) || null : null;",
          )

          old_scan_block = '''        <QueryBar onQuery={handleMaintenanceScan} onReset={resetMaintenanceScan}>
          <QueryItem label="扫描光标">
            <Input value={maintenanceScan} allowClear disabled={!isDraft || !allMaintenanceTagsReady} placeholder={scanPlaceholder} onChange={(event) => setMaintenanceScan(event.target.value)} onPressEnter={handleMaintenanceScan} />
          </QueryItem>
        </QueryBar>

        <Card size="small" title="接收资产明细" extra={(
          <Space>
            <Typography.Text type="secondary">共 {visibleMaintenanceRows.length} 条</Typography.Text>'''

          new_scan_block = '''        <Card
          size="small"
          title="扫描核对"
          extra={<Button onClick={resetMaintenanceScan}>重置</Button>}
        >
          <Space direction="vertical" size={12} className="w-full">
            <div className="flex items-center gap-3">
              <Typography.Text className="w-[96px] shrink-0 text-right">扫描光标:</Typography.Text>
              <Input
                value={maintenanceScan}
                allowClear
                disabled={!isDraft || !allMaintenanceTagsReady}
                placeholder={scanPlaceholder}
                onChange={(event) => setMaintenanceScan(event.target.value)}
                onPressEnter={handleMaintenanceScan}
              />
            </div>
            <Table
              rowKey="key"
              size="small"
              bordered
              pagination={false}
              columns={[
                { title: '资产标签号', dataIndex: 'assetTag', width: 180, render: (value) => value || '' },
                { title: 'SN号', dataIndex: 'sn', width: 180, render: (value) => value || '' },
                { title: '物资说明', dataIndex: 'materialDesc', width: 320, render: (value) => value || '' },
                { title: '配置', dataIndex: 'config', width: 260, render: (value) => value || '' },
              ]}
              dataSource={[{
                key: 'scan-preview',
                assetTag: scanTargetAsset?.assetTag || '',
                sn: scanTargetAsset?.sn || '',
                materialDesc: scanTargetAsset?.materialDesc || '',
                config: scanTargetAsset?.config || '',
              }]}
              scroll={{ x: 'max-content' }}
            />
          </Space>
        </Card>

        <Card size="small" title="接收资产明细" extra={(
          <Space>
            <Typography.Text type="secondary">共 {maintenanceRows.length} 条</Typography.Text>'''
          replace_once(old_scan_block, new_scan_block)

          replace_once(
              '          <Table rowKey="id" size="small" bordered columns={maintenanceColumns} dataSource={visibleMaintenanceRows} rowSelection={isDraft ? { selectedRowKeys: selectedMaintenanceKeys, onChange: setSelectedMaintenanceKeys, fixed: true, columnTitle: \'选择\', columnWidth: 64 } : undefined} scroll={{ x: \'max-content\' }} pagination={false} />',
              '          <Table rowKey="id" size="small" bordered columns={maintenanceColumns} dataSource={maintenanceRows} rowSelection={isDraft ? { selectedRowKeys: selectedMaintenanceKeys, onChange: setSelectedMaintenanceKeys, fixed: true, columnTitle: \'选择\', columnWidth: 64 } : undefined} scroll={{ x: \'max-content\' }} pagination={false} />',
          )

          if 'maintenanceFilterId' in source:
              raise RuntimeError('maintenanceFilterId still exists after patch')
          if 'visibleMaintenanceRows' in source:
              raise RuntimeError('visibleMaintenanceRows still exists after patch')

          path.write_text(source, encoding='utf-8')

      - name: Commit asset receipt scan update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/receipt-scan-preview-patch.yml
          git add src/pages/inventoryManagement/AssetReceiptPage.js
          git diff --cached --check
          git commit -m "feat: refine asset receipt scan comparison"
          git push origin HEAD:main
